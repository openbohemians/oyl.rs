[package]
name = "oyl"
description = "Safe Rust bindings to Oyl, a fast YAML 1.2 parser and emitter (C11, SIMD, zero-copy)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["yaml", "parser", "emitter", "serialization"]
categories = ["parser-implementations", "encoding"]
readme = "../README.md"

[dependencies]
oyl-sys = { version = "0.3.0", path = "../oyl-sys" }
serde = { version = "1", optional = true }

[features]
# oyl::from_str and friends: serde deserialization from a document's tree
serde = ["dep:serde"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
