[package]
name = "oyl-sys"
description = "Raw FFI bindings to Oyl, a fast YAML 1.2 parser and emitter in C11, built from vendored sources"
# the part after "+" is the vendored Oyl version; scripts/sync-oyl.sh sets it
version = "0.3.0+1.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["yaml", "parser", "emitter", "ffi"]
categories = ["external-ffi-bindings", "parser-implementations"]
links = "oyl"
build = "build.rs"
readme = "../README.md"

[build-dependencies]
cc = "1"
